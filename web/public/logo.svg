<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Castor">
  <title>Castor</title>
  <!--
    Marketing-only mark (the app-wide favicon in app/icon.svg is unchanged).
    A torn strip of tape laid across an ink tile — the landing page's whole
    idea, at logo scale: the site is the tile, the tape is the boundary.
  -->
  <rect width="128" height="128" rx="24" fill="#18130d"/>
  <g transform="rotate(-10 64 64)">
    <polygon
      points="8,46 20,42 34,48 48,41 62,49 76,40 90,48 104,41 118,47
              118,84 106,90 92,83 78,91 64,83 50,91 36,84 22,90 8,84"
      fill="#e8b023"
    />
  </g>
  <circle cx="30" cy="98" r="5" fill="#f4efe4" opacity="0.9"/>
</svg>
